[package]
name = "rwa-imr"
version = "1.1.0"
description = "Created with Anchor"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]
name = "rwa_imr"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
devnet = []
localnet = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["event-cpi"] }
rbac-utils = { path = "../../rbac-utils" }
