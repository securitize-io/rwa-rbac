[package]
name = "token-locks"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "token_locks"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["allow-missing-optionals"] }
anchor-spl = { version = "0.30.1", features = ["token_2022_extensions"] }
rwa-imr = { path = "../rwa-imr", features = ["cpi"] }
hex = "=0.4.3"
sha256 = "=1.5.0"